version: '3.8'

services:
  app:
    build: .
    container_name: elisha-sports-bot
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: npm run start

  postgres:
    image: postgres:16-alpine
    container_name: elisha-sports-bot-db
    environment:
      POSTGRES_DB: elisha_sports_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elisha-sports-bot-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
