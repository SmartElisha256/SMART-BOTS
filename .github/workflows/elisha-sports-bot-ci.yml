name: ELISHA SPORTS BOT CI

on:
  push:
    branches:
      - main
      - repair/**
      - fix/**
    paths:
      - "elisha-sports-bot/**"
      - ".github/workflows/elisha-sports-bot-ci.yml"
  pull_request:
    paths:
      - "elisha-sports-bot/**"
      - ".github/workflows/elisha-sports-bot-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elisha-sports-bot
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:change-me@localhost:5432/elisha_sports_bot
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: elisha-sports-bot/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run football ML route tests
        run: node --test tests/football-ml.test.js
      - name: Run tests
        run: npm test
      - name: Validate messaging configuration
        run: npm run validate:messaging
