name: ELISHA SPORTS BOT CI

on:
  push:
    branches:
      - main
      - repair/**
      - fix/**
    paths:
      - "elisha-sports-bot/**"
      - ".github/workflows/elisha-sports-bot-ci.yml"
  pull_request:
    paths:
      - "elisha-sports-bot/**"
      - ".github/workflows/elisha-sports-bot-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: elisha-sports-bot
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elisha_sports_bot
      REDIS_URL: redis://localhost:6379
      MESSAGING_PROVIDER: mock
      SPORTS_DATA_PROVIDER: mock
      ADMIN_API_KEY: test-admin-key-not-for-production
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python for cross-runtime prediction integration
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: elisha-sports-bot/football-analytics/requirements.txt
      - name: Install Python analytics dependencies
        run: python -m pip install -r football-analytics/requirements.txt
      - name: Prepare and train real EPL prediction artifacts
        run: |
          python football-analytics/prepare_epl_data.py
          python football-analytics/train.py --data football-analytics/data/epl_historical.csv --models-dir football-analytics/models
      - name: Install dependencies
        run: npm install
      - name: Run Node-to-Python prediction integration
        run: node --test --test-timeout=30000 tests/football-ml-integration.ci.js
      - name: Run football ML route tests
        run: node --test --test-timeout=15000 tests/football-ml.test.js
      - name: Run unit tests
        run: npm test
      - name: Validate messaging configuration
        run: npm run validate:messaging
