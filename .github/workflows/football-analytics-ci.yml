name: Football Analytics CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "elisha-sports-bot/football-analytics/**"
      - ".github/workflows/football-analytics-ci.yml"
  pull_request:
    paths:
      - "elisha-sports-bot/football-analytics/**"
      - ".github/workflows/football-analytics-ci.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elisha-sports-bot/football-analytics
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: elisha-sports-bot/football-analytics/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate synthetic fixture data for deterministic tests
        run: python download_data.py --input data/synthetic_matches.csv
      - name: Normalize preserved EPL season files
        run: python prepare_epl_data.py
      - name: Train baseline models on historical EPL data
        run: python train.py --data data/epl_historical.csv
      - name: Evaluate on a chronological EPL holdout
        run: python evaluate.py --data data/epl_historical.csv
      - name: Evaluate season-by-season walk-forward folds
        run: python evaluate_walkforward.py --data data/epl_historical.csv
      - name: Run Python tests
        run: pytest -q
